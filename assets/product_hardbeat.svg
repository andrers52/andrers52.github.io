<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Hardbeat</title>
  <desc id="desc">A cyan square dodging neon musical obstacles in a dark arena</desc>
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#080b16"/>
      <stop offset="1" stop-color="#05060c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <g stroke="#121c36" stroke-width="2" opacity=".65">
    <path d="M0 160H1280M0 280H1280M0 400H1280M0 520H1280M0 640H1280"/>
    <path d="M160 100V720M320 100V720M480 100V720M640 100V720M800 100V720M960 100V720M1120 100V720"/>
  </g>
  <rect width="1280" height="88" fill="#080b16"/>
