    <rect x="204" y="346" width="24" height="24"/>
    <rect x="226" y="342" width="30" height="30"/>
  </g>
  <text x="640" y="630" text-anchor="middle" fill="#6c7a9c" font-family="monospace" font-size="25" letter-spacing="7">ONE BODY. ONE TRACK. FIVE MOVEMENTS.</text>
