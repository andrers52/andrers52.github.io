  <text x="54" y="56" fill="#e8f6ff" font-family="monospace" font-size="34" letter-spacing="5">HARDBEAT</text>
  <rect x="914" y="34" width="250" height="16" fill="#2a3350"/>
  <rect x="914" y="34" width="250" height="16" fill="#4dffc4"/>
  <g filter="url(#glow)">
    <rect x="248" y="338" width="44" height="44" fill="#00f0ff"/>
    <rect x="550" y="260" width="64" height="64" fill="#ff2d8d"/>
    <rect x="815" y="450" width="52" height="52" fill="#ff2d8d" transform="rotate(20 841 476)"/>
    <circle cx="1030" cy="292" r="42" fill="#e056fd"/>
    <path d="M408 208L452 250 426 284 480 326 448 364 502 404" fill="none" stroke="#e056fd" stroke-width="12"/>
    <path d="M408 208L452 250 426 284 480 326 448 364 502 404" fill="none" stroke="#e8f6ff" stroke-width="3"/>
    <circle cx="408" cy="208" r="25" fill="#ff2d8d"/>
    <circle cx="502" cy="404" r="25" fill="#ff2d8d"/>
  </g>
  <g fill="#00f0ff" opacity=".32">
