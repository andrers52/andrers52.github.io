  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    /* The engine renders at a fixed internal resolution; the canvas stretches to the window.
       Pointer coordinates are converted by the engine, so stretching is safe. */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <canvas id="canvas" width="1280" height="720"></canvas>
  <script>
    // The engine resolves its canvas from Module.canvas; raylib's web backend reads its id.
    var Module = { canvas: document.getElementById('canvas') };
  </script>
  <script src="./z32.js"></script>
</body>

</html>
