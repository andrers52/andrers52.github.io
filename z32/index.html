<!DOCTYPE HTML>
<html>

<head>
  <meta charset="utf-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title> Z32 </title>
  <meta name="description" content="The action-packed space shooter!">
  <meta property="og:description" content="The action-packed space shooter!">
  <meta name="keywords" content="Z32, asteroids, game, games, web game, html5, fun, flash, arcade, retro">

  <meta property="og:site_name" content="Z32" />
  <link rel="shortcut icon" href="./z32_32x32.png" type="image/x-icon" />
  <link rel="icon" href="./z32_32x32.png" type="image/x-icon" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    /* The canvas bitmap is sized to the real viewport in device pixels, so the browser
       displays it 1:1 and does not stretch a fixed 1280x720 buffer. */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    // The engine resolves its canvas from Module.canvas; raylib's web backend reads its id.
    var Module = { canvas: document.getElementById('canvas') };

    // Size the bitmap to the viewport in device pixels before the engine initializes.
    // This keeps the game at native resolution on wide and HiDPI screens.
    (function () {
      const dpr = window.devicePixelRatio || 1;
      Module.canvas.width = Math.max(1, Math.round(window.innerWidth * dpr));
      Module.canvas.height = Math.max(1, Math.round(window.innerHeight * dpr));
    })();
  </script>
  <script src="./z32.js"></script>
</body>

</html>
